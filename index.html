<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #161b22 0%, #1f2937 100%);
    border-bottom: 1px solid #30363d;
    padding: 32px 40px;
  }
  header h1 { font-size: 28px; color: #58a6ff; margin-bottom: 6px; }
  header p { color: #8b949e; font-size: 14px; }
  .container { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  .stats { display: flex; gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 16px 24px; flex: 1; text-align: center;
  }
  .stat-card .num { font-size: 32px; font-weight: bold; color: #58a6ff; }
  .stat-card .label { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .card-grid { display: grid; gap: 16px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 24px; display: flex; justify-content: space-between;
    align-items: center; transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
  .card-info h2 { font-size: 18px; color: #e6edf3; margin-bottom: 6px; }
  .card-info .date { font-size: 12px; color: #8b949e; }
  .card-actions { display: flex; gap: 10px; flex-shrink: 0; margin-left: 20px; }
  .btn {
    padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .8; }
  .btn-primary { background: #238636; color: #fff; border: 1px solid #2ea043; }
  .btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .empty {
    text-align: center; padding: 80px 20px; color: #8b949e;
    border: 2px dashed #30363d; border-radius: 12px;
  }
  .empty p { font-size: 16px; margin-top: 12px; }
  footer {
    text-align: center; color: #8b949e; font-size: 12px;
    padding: 40px 20px; border-top: 1px solid #21262d; margin-top: 60px;
  }
</style>
